<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(120 0.5 0.5)">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.15" r="0.75">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- 纹理 -->
  <g opacity="0.16" stroke="#a78bfa" stroke-width="1.4">
    <line x1="120" y1="0" x2="120" y2="630" />
    <line x1="310" y1="0" x2="310" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="690" y1="0" x2="690" y2="630" />
    <line x1="880" y1="0" x2="880" y2="630" />
    <line x1="1070" y1="0" x2="1070" y2="630" />
    <line x1="0" y1="110" x2="1200" y2="110" />
    <line x1="0" y1="260" x2="1200" y2="260" />
    <line x1="0" y1="410" x2="1200" y2="410" />
    <line x1="0" y1="560" x2="1200" y2="560" />
  </g>

  <g opacity="0.14" fill="none" stroke="#a78bfa" stroke-width="1.8">
    <circle cx="960" cy="150" r="80" />
    <circle cx="960" cy="150" r="150" />
    <circle cx="960" cy="150" r="220" />
  </g>

  <rect width="1200" height="630" fill="url(#fade)" />

  <!-- 角标 -->
  <rect x="80" y="76" width="196" height="44" rx="22" fill="#000" opacity="0.28" />
  <text x="104" y="106" fill="#c4b5fd" font-size="22" font-weight="600"
        font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">HITARI'S BLOG</text>

  <!-- 主标题 -->
  <text x="80" y="290" fill="#fff" font-size="74" font-weight="800"
        font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" letter-spacing="-1.5">
    前端工程与
  </text>
  <text x="80" y="382" fill="#fff" font-size="74" font-weight="800"
        font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" letter-spacing="-1.5">
    LLM 应用实践
  </text>

  <!-- 副标题 -->
  <text x="80" y="452" fill="#ddd6fe" font-size="28" font-weight="500"
        font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
    React · TypeScript · 浏览器内向量检索 · 流式 LLM
  </text>

  <!-- 底部信息 -->
  <text x="80" y="556" fill="#c4b5fd" font-size="24" font-weight="600"
        font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
    hidari123.github.io
  </text>
