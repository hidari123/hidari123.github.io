name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只需要一个并发任务，旧的自动取消
concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 跳过 LFS 拉取：模型文件是指针，构建博客用不到，
          # 真拉下来要多下几百 MB，严重拖慢 CI。
          lfs: false

      # pnpm 必须先于 setup-node：setup-node 的 `cache: pnpm`
      # 要在执行时找到 pnpm 才能算缓存键，否则这一步直接失败。
      #
      # 注意：这里绝对不能再写 version。pnpm/action-setup@v4 会把
      # with.version 和 package.json 的 packageManager 字段做
      # **字符串全等**比较（不是比 major），两者同时存在且不一致时
      # 直接抛 "Multiple versions of pnpm specified" 而失败。
      # packageManager 已经是唯一事实来源，删掉 version 才不会冲突。
      # 保留 packageManager 钉 9 的理由：pnpm >= 10 默认不执行依赖的
      # install 脚本（ERR_PNPM_IGNORED_BUILDS），而 vite 构建依赖
      # esbuild 的原生二进制。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          standalone: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 拉 RAG 嵌入模型（int8 量化，22MB）。
      # 之前漏了这一步，模型是 git-lfs 指针（133 字节），
      # 线上点「索引博客」会直接失败 —— 但构建照样通过，属于静默故障。
      # continue-on-error：拉不到模型不该阻断部署，只是 RAG 功能降级。
      - name: Fetch embedding model
        run: pnpm run fetch:model
        continue-on-error: true

      - name: Type check
        run: pnpm run tsc

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run vite-build

      # 校验关键产物存在，避免"构建通过但产物是空壳"的情况
      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/posts/index.json || { echo "::error::index.json missing"; exit 1; }
          test -f dist/404.html || { echo "::error::404.html missing (SPA fallback broken)"; exit 1; }
          test -f dist/sitemap.xml || { echo "::error::sitemap.xml missing"; exit 1; }
          test -d dist/blogs || { echo "::error::blogs dir missing"; exit 1; }
          echo "blog count: $(ls dist/blogs | wc -l)"

      # 密钥泄漏门禁（两道）：API Key 被打进构建产物、或 .env 还在版本库里，直接拒绝部署。
      # 前者是真正的护栏 —— 前面几步配置对了，不代表产物里没有意外引用的密钥。
      # 后者防的是回归：这个仓库的 .env 曾经被提交过一次，光扫产物是发现不了的。
      - name: Audit secrets
        run: pnpm run audit:secrets

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # 保留历史，方便回滚；会累积体积但对博客可接受
          keep_files: false

      - name: Summary
        run: |
          echo "### 🚀 Deployed to gh-pages" >> $GITHUB_STEP_SUMMARY
          echo "commit: \`${GITHUB_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "model_int8 present: $(test -f dist/models/all-MiniLM-L6-v2/onnx/model_int8.onnx && echo yes || echo NO)" >> $GITHUB_STEP_SUMMARY
          echo "model_int8 size: $(du -h dist/models/all-MiniLM-L6-v2/onnx/model_int8.onnx 2>/dev/null | cut -f1 || echo missing)" >> $GITHUB_STEP_SUMMARY
          echo "articles: $(ls dist/blogs | wc -l)" >> $GITHUB_STEP_SUMMARY