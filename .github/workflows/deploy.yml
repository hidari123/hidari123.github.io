name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只需要一个并发任务，旧的自动取消
concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 跳过 LFS 拉取：模型文件是指针，构建博客用不到，
          # 真拉下来要多下几百 MB，严重拖慢 CI。
          lfs: false

      # pnpm 必须先于 setup-node：setup-node 的 `cache: pnpm`
      # 要在执行时找到 pnpm 才能算缓存键，否则这一步直接失败。
      #
      # 注意：这里绝对不能再写 version。pnpm/action-setup@v4 会把
      # with.version 和 package.json 的 packageManager 字段做
      # **字符串全等**比较（不是比 major），两者同时存在且不一致时
      # 直接抛 "Multiple versions of pnpm specified" 而失败。
      # packageManager 已经是唯一事实来源，删掉 version 才不会冲突。
      # 保留 packageManager 钉 9 的理由：pnpm >= 10 默认不执行依赖的
      # install 脚本（ERR_PNPM_IGNORED_BUILDS），而 vite 构建依赖
      # esbuild 的原生二进制。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          standalone: false

      # Node 必须 >= 22.22.2：jsdom@30 声明 engines
      # "^22.22.2 || ^24.15.0 || >=26.0.0"，它经由 undici@8 在运行时
      # 真的用到新 Node API（Node 20 上会抛
      # TypeError: Cannot read properties of undefined (reading 'bind')）。
      # 本地是 24.18，CI 就跟 24 —— 本地能跑通 CI 就必须能跑通。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---------------------------------------------------------------------------
      # 关于 Giscus 配置：为什么不从 secrets 写 .env
      #
      # 2026-10-23 曾经因为 .env 被 untrack，CI 拿不到 Giscus 的四个值，
      # 线上评论区直接消失（对比 9b1e3b4 与其后所有 commit 即可复现）。
      # 当时的修法提议是"把四个值搬进 Actions secrets，CI 里写 .env 再构建"。
      # 实测这个修法方向错了：
      #
      #   1. Giscus 的 repoId / categoryId 天生公开 —— 它们被内联进每个访客的
      #      浏览器脚本，任何人右键就能看到。真正的权限边界在 GitHub Discussions
      #      那一侧，不在这两个字符串上。放进 secrets 是心理安慰，不是防护。
      #   2. secrets 引入新的故障面：值漏配、名字拼错、仓库 fork 后拿不到 secret，
      #      每一个都会让线上评论区无声消失，而且要跨 commit 才能查。
      #
      # 所以配置源改为 src/config/giscus.ts（进版本库，随代码一起 review）。
      # Giscus 的 API Key 走的是完全另一条路：用户自己在设置面板填，
      # 构建期不注入任何凭据，audit:secrets 仍在下面兜底。
      #
      # 如果你坚持要 secrets 覆盖能力，src/config/giscus.ts 已经留了口子：
      # 同名 VITE_GISCUS_* 环境变量存在时会覆盖默认值，缺一个就整体回落。
      # ---------------------------------------------------------------------------

      # 拉 RAG 嵌入模型（int8 量化，22MB）。
      # 之前漏了这一步，模型是 git-lfs 指针（133 字节），
      # 线上点「索引博客」会直接失败 —— 但构建照样通过，属于静默故障。
      # continue-on-error：拉不到模型不该阻断部署，只是 RAG 功能降级。
      - name: Fetch embedding model
        run: pnpm run fetch:model
        continue-on-error: true

      - name: Type check
        run: pnpm run tsc

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run vite-build

      # 校验关键产物存在，避免"构建通过但产物是空壳"的情况
      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/posts/index.json || { echo "::error::index.json missing"; exit 1; }
          test -f dist/404.html || { echo "::error::404.html missing (SPA fallback broken)"; exit 1; }
          test -f dist/sitemap.xml || { echo "::error::sitemap.xml missing"; exit 1; }
          test -d dist/blogs || { echo "::error::blogs dir missing"; exit 1; }
          echo "blog count: $(ls dist/blogs | wc -l)"

      # 评论区门禁：把"配置是否真的进了产物"变成可验证的事。
      # 上一轮故障的性质是「构建通过但评论区不工作」—— 没有任何一步会红。
      # 这里直接 grep 产物：配置在 src/config/giscus.ts 里，进不了 bundle
      # 只有一种可能（被打包器摇掉了或被误删），那种情况必须拦住部署。
      - name: Verify giscus config in bundle
        run: |
          for v in R_kgDOSc6mtw DIC_kwDOSc6mt84C8_-2; do
            if ! grep -qr "$v" dist/assets/; then
              echo "::error::giscus value $v missing from bundle — comments will break on deploy"
              exit 1
            fi
          done
          echo "giscus config present in bundle"

      # 密钥泄漏门禁（两道）：API Key 被打进构建产物、或 .env 还在版本库里，直接拒绝部署。
      # 前者是真正的护栏 —— 前面几步配置对了，不代表产物里没有意外引用的密钥。
      # 后者防的是回归：这个仓库的 .env 曾经被提交过一次，光扫产物是发现不了的。
      - name: Audit secrets
        run: pnpm run audit:secrets

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # 保留历史，方便回滚；会累积体积但对博客可接受
          keep_files: false

      - name: Summary
        run: |
          echo "### 🚀 Deployed to gh-pages" >> $GITHUB_STEP_SUMMARY
          echo "commit: \`${GITHUB_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "model_int8 present: $(test -f dist/models/all-MiniLM-L6-v2/onnx/model_int8.onnx && echo yes || echo NO)" >> $GITHUB_STEP_SUMMARY
          echo "model_int8 size: $(du -h dist/models/all-MiniLM-L6-v2/onnx/model_int8.onnx 2>/dev/null | cut -f1 || echo missing)" >> $GITHUB_STEP_SUMMARY
          echo "articles: $(ls dist/blogs | wc -l)" >> $GITHUB_STEP_SUMMARY